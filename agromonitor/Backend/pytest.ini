[pytest]
DJANGO_SETTINGS_MODULE = core.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=50

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    auth: marks tests related to authentication
    clima: marks tests related to climate module
    sensores: marks tests related to sensors module
    
testpaths = 
    Cadastro
    Clima
    Monitor
    sensores
    Estufa

norecursedirs = .git .venv migrations __pycache__ staticfiles media
